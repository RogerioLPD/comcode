name: comcode
description: "Apresentamos a Comcode, sua parceira na criação de softwares e aplicativos de ponta! Nosso site moderno e responsivo, com uma landing page comercialmente irresistível e animações inovadoras, irá impulsionar sua presença digital."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  intl: 0.20.2
  url_launcher: ^6.0.0
  flutter_animate: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  provider: ^6.1.2
  go_router: ^16.2.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
